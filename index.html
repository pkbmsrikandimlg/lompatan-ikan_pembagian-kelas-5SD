<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lompatan Ikan Pintar - Pembagian Kelas 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            touch-action: none; /* Prevent pinch zoom etc */
            color: white;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Fredoka One', cursive;
        }

        /* Container for the game canvases */
        #game-container {
            display: grid;
            width: 100vw;
            height: 100vh;
            gap: 4px;
            background-color: #0f172a; /* Dark border between splits */
            padding: 4px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* Split screen grid layouts */
        .layout-solo { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .layout-duel { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        .layout-squad { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        /* Mobile Portrait Override for Duel */
        @media (max-width: 768px) and (orientation: portrait) {
            .layout-duel { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }

        .player-view {
            position: relative;
            background: linear-gradient(to bottom, #87CEEB 0%, #4682B4 100%);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
        }

        .question-box {
            background: rgba(255, 255, 255, 0.9);
            color: #1e3a8a;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 3px solid #60a5fa;
            align-self: center;
            pointer-events: auto;
            transition: transform 0.2s;
        }

        .controls-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            pointer-events: auto;
            margin-bottom: 10px;
        }

        .answer-btn {
            background: linear-gradient(to bottom, #fcd34d, #f59e0b);
            border: 3px solid #b45309;
            border-radius: 12px;
            color: #78350f;
            font-family: 'Fredoka One', cursive;
            font-size: 1.25rem;
            padding: 0.75rem;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
            box-shadow: 0 4px 0 #92400e, 0 5px 5px rgba(0,0,0,0.3);
            transition: all 0.1s;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .answer-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #92400e, 0 1px 2px rgba(0,0,0,0.3);
        }

        .answer-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #92400e;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            backdrop-filter: blur(4px);
        }

        #main-menu {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .menu-card {
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.3);
            border: 4px solid #60a5fa;
            text-align: center;
            max-width: 90%;
            width: 400px;
        }

        .mode-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 1rem;
            font-size: 1.25rem;
            background: #f8fafc;
            color: #1e40af;
            border: none;
            border-radius: 12px;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 0 #cbd5e1;
        }
        .mode-btn:hover { background: #e2e8f0; transform: translateY(-2px); box-shadow: 0 6px 0 #cbd5e1; }
        .mode-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #cbd5e1; }

        /* Fullscreen button */
        #fs-btn {
            position: fixed;
            top: 10px; right: 10px;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 44px; height: 44px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            backdrop-filter: blur(4px);
        }

        /* Game Over Overlay */
        .game-over-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .question-box { font-size: 1.2rem; padding: 0.3rem 0.8rem; }
            .answer-btn { font-size: 1rem; padding: 0.5rem; }
            .controls-area { grid-template-columns: repeat(4, 1fr); gap: 5px; } /* 4 in a row on small height */
        }
    </style>
</head>
<body>

    <!-- Fullscreen Toggle -->
    <button id="fs-btn" onclick="toggleFullScreen()" aria-label="Fullscreen">⛶</button>

    <!-- Main Menu -->
    <div id="main-menu">
        <div class="menu-card">
            <h1 class="text-4xl mb-2 text-yellow-300 drop-shadow-md">Lompatan Ikan</h1>
            <h2 class="text-xl mb-6 text-blue-100">Matematika - Pembagian Kelas 5</h2>
            
            <p class="text-sm mb-4 text-blue-200">Pilih Mode Bermain:</p>
            
            <button class="mode-btn" onclick="startGame(1)">👤 Solo (1 Pemain)</button>
            <button class="mode-btn" onclick="startGame(2)">⚔️ Duel (2 Pemain)</button>
            <button class="mode-btn" onclick="startGame(4)">🛡️ Squad (4 Pemain)</button>
            
            <div class="mt-6 text-xs text-blue-300 text-left bg-blue-900 bg-opacity-50 p-3 rounded-lg">
                <p><strong>Cara Bermain:</strong></p>
                <ul class="list-disc pl-4 mt-1">
                    <li>Ikan melompat ke kolam.</li>
                    <li>Pilih jawaban pembagian yang benar!</li>
                    <li>Benar = Ikan gembira, lanjut ke soal baru.</li>
                    <li>Salah = Air keruh, ikan tenggelam.</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Game Container (Grid) -->
    <div id="game-container" style="display: none;">
        <!-- Player Views will be injected here by JS -->
    </div>

    <script>
        // --- AUDIO SYSTEM (Synthesized to avoid external assets) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sfx = {
            jump: () => {
                playTone(300, 'sine', 0.1, 0.1);
                setTimeout(() => playTone(400, 'sine', 0.2, 0.1), 50);
            },
            correct: () => {
                playTone(523.25, 'triangle', 0.1, 0.1); // C5
                setTimeout(() => playTone(659.25, 'triangle', 0.1, 0.1), 100); // E5
                setTimeout(() => playTone(783.99, 'triangle', 0.3, 0.15), 200); // G5
            },
            wrong: () => {
                playTone(200, 'sawtooth', 0.3, 0.1);
                setTimeout(() => playTone(150, 'sawtooth', 0.5, 0.1), 150);
            },
            splash: () => {
                // Noise burst for splash
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const bufferSize = audioCtx.sampleRate * 0.2; // 0.2 seconds
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                // Filter for water sound
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 1000;
                
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            }
        };

        // --- MATH LOGIC ---
        function generateDivisionProblem() {
            // Target Class 5 SD: Dividends up to ~100, Divisors up to 10
            const divisor = Math.floor(Math.random() * 9) + 2; // 2 to 10
            const quotient = Math.floor(Math.random() * 10) + 1; // 1 to 10
            const dividend = divisor * quotient;
            
            // Generate wrong answers
            let answers = new Set([quotient]);
            while(answers.size < 4) {
                let offset = Math.floor(Math.random() * 5) + 1;
                let wrong = Math.random() > 0.5 ? quotient + offset : quotient - offset;
                if(wrong > 0 && wrong !== quotient) answers.add(wrong);
            }
            
            let answerArray = Array.from(answers);
            // Shuffle
            for (let i = answerArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [answerArray[i], answerArray[j]] = [answerArray[j], answerArray[i]];
            }

            return {
                text: `${dividend} ÷ ${divisor} = ?`,
                correct: quotient,
                options: answerArray
            };
        }

        // --- UTILS ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- GAME ENGINE ---
        class PlayerInstance {
            constructor(id, container, colorTheme) {
                this.id = id;
                this.container = container;
                this.colorTheme = colorTheme;
                
                // State
                this.score = 0;
                this.isGameOver = false;
                this.problem = null;
                
                // Physics/Animation State
                this.fish = { x: 50, y: 150, vy: 0, vx: 0, state: 'idle', jumpTargetY: 0, rotation: 0 }; // states: idle, jumping, happy, dead
                this.platforms = [];
                this.particles = [];
                this.waterLevel = 0; // 0 is normal, 1 is fully black/dead
                this.rainIntensity = 0;
                
                this.setupDOM();
                this.resize();
                this.generateNewProblem(true); // Initial setup
                
                // Bind methods
                this.loop = this.loop.bind(this);
                this.reqId = requestAnimationFrame(this.loop);
            }

            setupDOM() {
                // Create Player Wrapper
                this.wrapper = document.createElement('div');
                this.wrapper.className = 'player-view';
                
                // Canvas
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.wrapper.appendChild(this.canvas);
                
                // UI Layer
                this.uiLayer = document.createElement('div');
                this.uiLayer.className = 'ui-layer';
                
                // Header
                const header = document.createElement('div');
                header.className = 'player-header';
                header.innerHTML = `
                    <span class="font-bold text-white text-sm">Pemain ${this.id}</span>
                    <span class="font-bold text-yellow-300 text-sm">Skor: <span id="score-${this.id}">0</span></span>
                `;
                this.uiLayer.appendChild(header);
                
                // Question
                this.questionEl = document.createElement('div');
                this.questionEl.className = 'question-box brand-font';
                this.uiLayer.appendChild(this.questionEl);
                
                // Controls
                this.controlsEl = document.createElement('div');
                this.controlsEl.className = 'controls-area';
                this.uiLayer.appendChild(this.controlsEl);

                // Game Over Screen
                this.gameOverEl = document.createElement('div');
                this.gameOverEl.className = 'game-over-screen';
                this.gameOverEl.innerHTML = `
                    <h2 class="text-3xl text-red-500 mb-2 brand-font drop-shadow-md">Yahh, Salah!</h2>
                    <p class="text-xl text-white mb-4">Skor Akhir: <span id="final-score-${this.id}">0</span></p>
                    <button class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-full" onclick="restartPlayer(${this.id})">Coba Lagi</button>
                `;
                this.wrapper.appendChild(this.gameOverEl);
                
                this.wrapper.appendChild(this.uiLayer);
                this.container.appendChild(this.wrapper);
                
                // Event Listener for resize
                this.resizeObserver = new ResizeObserver(() => this.resize());
                this.resizeObserver.observe(this.wrapper);
            }

            resize() {
                const rect = this.wrapper.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
                this.cw = rect.width;
                this.ch = rect.height;
                
                // Recalculate positions based on new size
                this.baseY = this.ch * 0.7; // Water/Platform line
                if(this.fish.state === 'idle') {
                    this.fish.y = this.baseY - 20;
                    this.fish.x = this.cw / 2;
                }
            }

            generateNewProblem(isInitial = false) {
                this.problem = generateDivisionProblem();
                this.questionEl.textContent = this.problem.text;
                this.questionEl.style.transform = 'scale(1.2)';
                setTimeout(() => this.questionEl.style.transform = 'scale(1)', 200);

                // Render buttons
                this.controlsEl.innerHTML = '';
                this.problem.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'answer-btn';
                    btn.textContent = opt;
                    btn.onclick = () => this.handleAnswer(opt, index);
                    this.controlsEl.appendChild(btn);
                });

                // Set up visual platforms based on screen width
                this.platforms = [];
                const padding = this.cw * 0.1;
                const availableWidth = this.cw - (padding * 2);
                const spacing = availableWidth / 3;
                
                this.problem.options.forEach((opt, index) => {
                    this.platforms.push({
                        x: padding + (spacing * index),
                        y: this.baseY + (isInitial ? 0 : this.ch), // Start below screen if not initial
                        targetY: this.baseY,
                        text: opt,
                        isCorrect: opt === this.problem.correct
                    });
                });
                
                // Reset fish position if not jumping
                if(isInitial) {
                    this.fish.x = this.cw / 2;
                    this.fish.y = this.baseY - 20;
                }
            }

            handleAnswer(selectedAns, btnIndex) {
                if (this.fish.state !== 'idle' || this.isGameOver) return; // Prevent multiple clicks

                // Disable buttons
                Array.from(this.controlsEl.children).forEach(btn => btn.disabled = true);

                const isCorrect = selectedAns === this.problem.correct;
                const targetPlatform = this.platforms[btnIndex];

                // Start Jump Animation
                this.fish.state = 'jumping';
                sfx.jump();
                
                // Calculate jump physics trajectory (parabola)
                const startX = this.fish.x;
                const startY = this.fish.y;
                const targetX = targetPlatform.x;
                const targetY = targetPlatform.targetY - 20; // Land slightly above platform
                
                const jumpDuration = 40; // frames
                let frame = 0;
                
                this.fish.isCorrectChoice = isCorrect;

                const jumpInterval = setInterval(() => {
                    frame++;
                    let progress = frame / jumpDuration;
                    
                    // Linear X
                    this.fish.x = startX + (targetX - startX) * progress;
                    
                    // Parabolic Y (jump arc)
                    const height = 100; // Jump height
                    this.fish.y = startY + (targetY - startY) * progress - Math.sin(progress * Math.PI) * height;
                    
                    // Rotation
                    this.fish.rotation = (targetX > startX ? 1 : -1) * Math.sin(progress * Math.PI) * 0.5;

                    if (frame >= jumpDuration) {
                        clearInterval(jumpInterval);
                        this.fish.rotation = 0;
                        this.fish.y = targetY;
                        this.fish.x = targetX;
                        
                        this.resolveAnswer(isCorrect);
                    }
                }, 16);
            }

            resolveAnswer(isCorrect) {
                if (isCorrect) {
                    sfx.correct();
                    this.score += 10;
                    document.getElementById(`score-${this.id}`).textContent = this.score;
                    
                    this.fish.state = 'happy';
                    this.createSplash(this.fish.x, this.fish.y, '#3b82f6');
                    
                    // Transition to next problem
                    setTimeout(() => {
                        this.transitionToNext();
                    }, 1000);

                } else {
                    sfx.wrong();
                    this.fish.state = 'dead';
                    this.isGameOver = true;
                    this.createSplash(this.fish.x, this.fish.y, '#111827');
                    
                    // Environmental changes for wrong answer
                    this.waterLevel = 1; 
                    this.rainIntensity = 100;
                    
                    setTimeout(() => {
                        this.showGameOver();
                    }, 1500);
                }
            }

            transitionToNext() {
                // Drop old platforms
                this.platforms.forEach(p => p.targetY = this.ch + 100);
                
                // Drop fish slightly
                this.fish.state = 'idle';
                
                setTimeout(() => {
                    this.generateNewProblem();
                    // Move fish back to center for next jump smoothly
                    this.fish.x = this.cw / 2; 
                }, 500);
            }

            showGameOver() {
                document.getElementById(`final-score-${this.id}`).textContent = this.score;
                this.gameOverEl.classList.add('active');
            }

            restart() {
                this.score = 0;
                this.isGameOver = false;
                this.waterLevel = 0;
                this.rainIntensity = 0;
                this.fish.state = 'idle';
                this.fish.rotation = 0;
                this.particles = [];
                document.getElementById(`score-${this.id}`).textContent = this.score;
                this.gameOverEl.classList.remove('active');
                this.generateNewProblem(true);
            }

            createSplash(x, y, color) {
                sfx.splash();
                for(let i=0; i<15; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 1) * 10,
                        life: 1,
                        color: color,
                        size: Math.random() * 5 + 2
                    });
                }
            }

            // --- DRAWING ROUTINES ---
            drawFish(ctx, x, y, state, rotation) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);

                // Body
                ctx.fillStyle = state === 'dead' ? '#9ca3af' : this.colorTheme;
                ctx.beginPath();
                ctx.ellipse(0, 0, 20, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = state === 'dead' ? '#4b5563' : '#fff';
                ctx.stroke();

                // Tail
                ctx.beginPath();
                ctx.moveTo(-18, 0);
                ctx.lineTo(-30, -10);
                ctx.lineTo(-30, 10);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Fin
                ctx.beginPath();
                ctx.moveTo(0, -15);
                ctx.lineTo(-5, -25);
                ctx.lineTo(5, -15);
                ctx.fill();

                // Eye
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(10, -5, 5, 0, Math.PI * 2);
                ctx.fill();

                // Pupil
                ctx.fillStyle = state === 'dead' ? 'transparent' : 'black';
                ctx.beginPath();
                ctx.arc(12, -5, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Dead Eye (X)
                if (state === 'dead') {
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(7, -8); ctx.lineTo(13, -2);
                    ctx.moveTo(13, -8); ctx.lineTo(7, -2);
                    ctx.stroke();
                }

                // Mouth
                ctx.beginPath();
                if (state === 'happy') {
                    ctx.arc(15, 5, 5, 0, Math.PI); // Smile
                } else if (state === 'dead') {
                    ctx.moveTo(12, 8); ctx.lineTo(18, 8); // Straight line
                } else {
                    ctx.arc(16, 5, 3, 0, Math.PI); // Small open mouth
                }
                ctx.stroke();

                ctx.restore();
            }

            drawPlatform(ctx, x, y, text) {
                // Lilypad shape
                ctx.save();
                ctx.translate(x, y);
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(2, 5, 30, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Pad
                ctx.fillStyle = '#4ade80';
                ctx.strokeStyle = '#166534';
                ctx.lineWidth = 2;
                ctx.beginPath();
                // Draw a circle with a slice cut out
                ctx.arc(0, 0, 30, 0.2, Math.PI * 2 - 0.2); 
                ctx.lineTo(0,0);
                ctx.closePath();
                // Flatten it to look isometric
                ctx.scale(1, 0.35); 
                ctx.fill();
                ctx.stroke();
                
                ctx.restore();
            }

            drawEnvironment(ctx) {
                // Background Gradient is handled by CSS, we draw water here
                
                // Water surface
                const waterY = this.baseY;
                
                // Interpolate water color based on waterLevel (0 to 1)
                // Normal: #3b82f6 (blue), Dead: #111827 (dark gray/black)
                const r = Math.floor(59 + (17 - 59) * this.waterLevel);
                const g = Math.floor(130 + (24 - 130) * this.waterLevel);
                const b = Math.floor(246 + (39 - 246) * this.waterLevel);
                const waterColor = `rgba(${r},${g},${b},0.8)`;
                
                ctx.fillStyle = waterColor;
                ctx.fillRect(0, waterY, this.cw, this.ch - waterY);

                // Water waves (simple sine wave)
                ctx.fillStyle = `rgba(255,255,255,0.2)`;
                ctx.beginPath();
                ctx.moveTo(0, waterY);
                for (let i = 0; i <= this.cw; i += 20) {
                    ctx.lineTo(i, waterY + Math.sin(i * 0.05 + Date.now() * 0.005) * 5);
                }
                ctx.lineTo(this.cw, this.ch);
                ctx.lineTo(0, this.ch);
                ctx.fill();

                // Rain
                if (this.rainIntensity > 0) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for(let i=0; i<this.rainIntensity; i++) {
                        let rx = Math.random() * this.cw;
                        let ry = Math.random() * this.ch;
                        ctx.moveTo(rx, ry);
                        ctx.lineTo(rx - 5, ry + 15);
                    }
                    ctx.stroke();
                }
            }

            loop() {
                // Clear Canvas (let CSS background show through for sky)
                this.ctx.clearRect(0, 0, this.cw, this.ch);

                this.drawEnvironment(this.ctx);

                // Update & Draw Platforms
                this.platforms.forEach(p => {
                    // Smooth move to target Y
                    p.y += (p.targetY - p.y) * 0.1;
                    this.drawPlatform(this.ctx, p.x, p.y, p.text);
                });

                // Update & Draw Particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.5; // gravity
                    p.life -= 0.02;
                    
                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.life;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.globalAlpha = 1.0;
                }

                // Fish Animations (Idle bobbing, happy jumping)
                let renderY = this.fish.y;
                let renderRot = this.fish.rotation;
                
                if (this.fish.state === 'idle') {
                    renderY += Math.sin(Date.now() * 0.005) * 5; // Bobbing
                } else if (this.fish.state === 'happy') {
                    // Small celebratory jumps
                    renderY -= Math.abs(Math.sin(Date.now() * 0.01)) * 20;
                } else if (this.fish.state === 'dead') {
                    // Float up slightly dead belly up
                    renderRot = Math.PI; // Upside down
                    renderY = this.baseY - 10 + Math.sin(Date.now() * 0.003) * 3;
                }

                this.drawFish(this.ctx, this.fish.x, renderY, this.fish.state, renderRot);

                this.reqId = requestAnimationFrame(this.loop);
            }
            
            destroy() {
                cancelAnimationFrame(this.reqId);
                this.resizeObserver.disconnect();
                this.wrapper.remove();
            }
        }

        // --- GLOBAL GAME MANAGER ---
        let players = [];
        const container = document.getElementById('game-container');
        const mainMenu = document.getElementById('main-menu');
        
        // distinct colors for players
        const playerColors = ['#f97316', '#ef4444', '#8b5cf6', '#14b8a6']; 

        function startGame(numPlayers) {
            // Setup Audio Context if needed (browsers require user interaction)
            if (audioCtx.state === 'suspended') audioCtx.resume();

            mainMenu.style.display = 'none';
            container.style.display = 'grid';
            
            // Set Layout Class
            container.className = ''; // reset
            if (numPlayers === 1) container.classList.add('layout-solo');
            else if (numPlayers === 2) container.classList.add('layout-duel');
            else if (numPlayers === 4) container.classList.add('layout-squad');

            // Clear old instances
            players.forEach(p => p.destroy());
            players = [];

            // Initialize Players
            for (let i = 0; i < numPlayers; i++) {
                players.push(new PlayerInstance(i + 1, container, playerColors[i]));
            }
        }

        // Global helper for the retry button in UI
        window.restartPlayer = function(id) {
            const player = players.find(p => p.id === id);
            if (player) player.restart();
        }

        // Handle Escape key to return to menu
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && container.style.display !== 'none') {
                container.style.display = 'none';
                mainMenu.style.display = 'flex';
                players.forEach(p => p.destroy());
                players = [];
                if (document.fullscreenElement) document.exitFullscreen();
            }
        });

    </script>
</body>
